name: Publish extension release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify tag matches package version
        run: |
          node -e "const pkg=require('./package.json'); if ('v'+pkg.version !== process.env.GITHUB_REF_NAME) { console.error('Tag and package version differ'); process.exit(1); }"

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: node --test tests/*.test.mjs

      - name: Build Chrome MV3
        run: npm run build:chrome

      - name: Build Edge MV3
        run: npm run build:edge

      - name: Package and verify downloadable ZIPs
        run: |
          set -euo pipefail
          mkdir -p dist
          for browser in chrome edge; do
            source_dir=".output/${browser}-mv3"
            test -f "${source_dir}/manifest.json"
            node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1])); if(m.version!==require('./package.json').version || m.manifest_version!==3) process.exit(1)" "$source_dir/manifest.json"
            archive="B2Y-Fix-${GITHUB_REF_NAME}-${browser}-mv3.zip"
            (cd "$source_dir" && zip -qr "${GITHUB_WORKSPACE}/dist/$archive" .)
            unzip -tq "dist/$archive"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "B2Y Fix $GITHUB_REF_NAME" --notes-file .github/release-notes.md
